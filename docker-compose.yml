services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ModienneG
      POSTGRES_DB: glpi_clone
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d

  app:
    build: .
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:ModienneG@db:5432/glpi_clone
      NODE_ENV: production

      # --- SMTP ---
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "465"
      SMTP_SECURE: "true"
      SMTP_USER: modienneg@gmail.com
      SMTP_PASS: gbcvnvbvzjvnvedy
      EMAIL_FROM: "Assistance DSI <modienneg@gmail.com>"

    volumes:
      - ./public/uploads:/app/public/uploads

    depends_on:
      - db

  nginx:
    image: nginx:latest
    ports:
      - "3000:80"
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

volumes:
  pgdata:
